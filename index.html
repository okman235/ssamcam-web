<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SsamCam — 주소가 바뀌었어요</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="canonical" href="https://ssamcam.higgsfield.app/" />
    <meta name="robots" content="noindex" />
    <!-- JS가 막힌 환경용 폴백. JS가 되면 아래 스크립트가 쿼리스트링까지 살려서 먼저 보낸다. -->
    <meta http-equiv="refresh" content="2; url=https://ssamcam.higgsfield.app/" />
    <style>
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #f5f2eb;
        color: #0f5d52;
        font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, 'Segoe UI', sans-serif;
      }
      h1 { margin: 0; font-size: 26px; }
      p { margin: 0; color: #4a6b64; line-height: 1.6; }
      a.go {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 999px;
        background: #0f5d52;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a.go:hover { background: #12564a; }
    </style>
  </head>
  <body>
    <img src="./favicon.png" alt="" width="56" height="56" />
    <h1>쌤캠이 이사했어요</h1>
    <p>새 주소로 자동 이동합니다.<br />안 넘어가면 아래 버튼을 눌러주세요.</p>
    <a class="go" href="https://ssamcam.higgsfield.app/">ssamcam.higgsfield.app 으로 가기</a>
    <script>
      // 유입 추적(utm_*)이 끊기지 않게 쿼리스트링을 그대로 넘긴다.
      location.replace('https://ssamcam.higgsfield.app/' + location.search);
    </script>
  </body>
</html>
